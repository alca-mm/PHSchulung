spring.application.name=phishing-awareness-trainer

# --- Persistenz: SQLite (lokale Entwicklung) ---
# Das Schema wird AUSSCHLIESSLICH von Flyway verwaltet (classpath:db/migration). Hibernate erzeugt
# oder aendert das Schema NICHT mehr (ddl-auto=validate). Der xerial-Treiber legt die DB-Datei an,
# aber keine Verzeichnisse -> ./data/ wird via .gitkeep vorgehalten; *.db* sind ge-gitignored.
spring.datasource.url=jdbc:sqlite:./data/app.db?busy_timeout=5000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# SQLite erzwingt Foreign Keys nur, wenn PRAGMA foreign_keys pro Verbindung aktiv ist (Default: OFF).
# Hikari fuehrt dies auf JEDER neu erzeugten physischen Pool-Verbindung aus (im Autocommit-Modus,
# ausserhalb einer Transaktion - innerhalb einer Transaktion waere das PRAGMA wirkungslos).
# Gilt fuer Flyway, Hibernate und JDBC gleichermassen; Nachweis: persistence/ForeignKey*Test.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

# --- JPA / Hibernate ---
# In Hibernate 7 wird der SQLite-Dialekt automatisch erkannt; explizit gesetzt fuer Determinismus.
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
# Validate prueft standardmaessig keine Unique-Constraints. NAMED prueft zusaetzlich, dass fuer jeden
# benannten Unique-Key des Mappings (hier @Index uk_recipient_tracking_token_hash in CampaignRecipient)
# ein gleichnamiger Index mit denselben Spalten existiert. Die UNIQUE-Eigenschaft selbst sichert
# SchemaMetadataTest ab.
spring.jpa.properties.hibernate.tooling.schema.unique_key_validation=NAMED
spring.jpa.open-in-view=false

# --- SMTP-Versand (generisches SMTP, providerunabhaengig) ---
# Zugangsdaten kommen ausschliesslich aus der Umgebung. Ohne gesetztes MAIL_HOST bleibt spring.mail.host
# leer; dann gilt SMTP als "nicht konfiguriert" und der Versand wird blockiert (nie stiller Fehlversand).
# Das SMTP-Passwort wird NIE in der DB gespeichert, NIE geloggt und NIE im HTML ausgegeben.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Timeouts (ms), damit weder echter Versand noch der SMTP-Verbindungstest die Oberflaeche lange blockieren.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

# --- Anwendungs-Schutzschalter fuer den Versand ---
# live-send-enabled: MUSS bewusst auf true gesetzt werden, damit ueberhaupt echte Mails rausgehen
#   (Default false verhindert versehentlichen Versand direkt nach dem Start).
# allowed-senders: erlaubte Absender (fail-closed: leer => kein Absender erlaubt). Eintrag mit '@' =
#   exakte Adresse (case-insensitive); Eintrag ohne '@' = erlaubte Absender-Domain.
# allowed-recipient-domains: wenn gesetzt, duerfen NUR Adressen dieser Domains empfangen; leer => keine
#   Empfaenger-Domainbeschraenkung.
app.mail.live-send-enabled=${APP_MAIL_LIVE_SEND_ENABLED:false}
app.mail.allowed-senders=${APP_MAIL_ALLOWED_SENDERS:}
app.mail.allowed-recipient-domains=${APP_MAIL_ALLOWED_RECIPIENT_DOMAINS:}
# default-sender: sichtbare Standard-Absenderadresse fuer den globalen E-Mail-Composer (KEIN Secret,
#   kein SMTP-Passwort). Muss zusaetzlich in allowed-senders erlaubt sein, sonst bleibt der Versand
#   gesperrt. Leer => kein Absender konfiguriert (Composer warnt und deaktiviert den Versand).
app.mail.default-sender=${APP_MAIL_DEFAULT_SENDER:}
app.mail.default-sender-name=${APP_MAIL_DEFAULT_SENDER_NAME:}

# --- Dateibibliothek (passive Trainingsdokumente) ---
# generated-dir: lokales Datenverzeichnis fuer erzeugte passive Dateien (DOCX/XML/PDF/XLSX/PPTX/TXT/CSV; nicht im Repository, nicht unter
#   src/main/resources oder target). Wird bei Bedarf angelegt; physische Dateinamen sind UUID-basiert.
# max-file-size-bytes: Obergrenze je erzeugter Datei (Default 5 MiB).
app.files.generated-dir=${APP_FILES_GENERATED_DIR:./data/generated-files}
app.files.max-file-size-bytes=${APP_FILES_MAX_FILE_SIZE_BYTES:5242880}

# --- Awareness-Tracking (empfaengerbezogener Trainingslink) ---
# base-url: oeffentliche Basis-URL des Trainingslink-Endpoints; der individuelle Link ist {base-url}/t/{token}.
#   KEIN Secret. HTTPS erforderlich, ausser Loopback (http://localhost) fuer die lokale Entwicklung - ein
#   Empfaenger AUSSERHALB des Entwicklungsrechners kann localhost NICHT erreichen. Leer => kein Trainingslink.
#   Beispiel (nur dokumentarisch): https://training.example.invalid
app.tracking.base-url=${APP_TRACKING_BASE_URL:}
# redirect-url: oeffentliche, statische Landingpage, auf die ein Empfaenger NACH dem serverseitigen Tracking
#   umgeleitet wird (HTTP-302). KEIN Secret und bewusst VERSCHIEDEN von base-url (base-url = der erreichbare
#   Spring-Server mit /t/{token}; redirect-url = nur die harmlose Info-/Schulungsseite). Nur https (ausser
#   Loopback), sonst gelten dieselben Sicherheitsregeln wie fuer base-url (TrackingLinkPolicy). Leer/ungueltig
#   => es wird NICHT umgeleitet, sondern die serverseitige Trainingsseite gezeigt. Das Ziel stammt NUR aus
#   dieser Konfiguration, nie aus dem Request (kein Open-Redirect).
#   Beispiel (nur dokumentarisch): https://alca-mm.github.io/PHSchulung/
app.tracking.redirect-url=${APP_TRACKING_REDIRECT_URL:}

# --- Admin-Zugriffsschutz (Spring Security) ---
# Genau EIN Admin-Benutzer, ausschliesslich aus der Umgebung. KEINE Default-Werte (fail-closed): sind
# Benutzername ODER Passwort leer, wird kein Admin-Benutzer angelegt und der Admin-Bereich bleibt gesperrt.
# Das Passwort wird NIE geloggt, NIE in der DB gespeichert und NIE im HTML ausgegeben.
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# --- Session-Cookie-Haertung ---
# HttpOnly (kein JS-Zugriff) und SameSite=Lax (CSRF-Abschwaechung). 'secure' wird bewusst NICHT erzwungen,
# damit lokale Entwicklung ueber HTTP moeglich bleibt; hinter HTTPS/Reverse-Proxy sollte das Cookie zusaetzlich
# 'Secure' gesetzt werden (server.servlet.session.cookie.secure=true bzw. Proxy-Konfiguration).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
