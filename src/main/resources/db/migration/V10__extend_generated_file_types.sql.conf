# Der Tabellen-Neuaufbau nutzt PRAGMA foreign_keys OFF/ON. SQLite kann PRAGMA foreign_keys nicht innerhalb
# einer Transaktion aendern; Flyway lehnt die Mischung aus PRAGMA und DDL in einer Transaktion ab. Daher wird
# dieses Skript bewusst OHNE umschliessende Transaktion ausgefuehrt (nicht atomar).
executeInTransaction=false
