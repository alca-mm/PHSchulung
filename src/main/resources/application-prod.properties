# --- Produktionsprofil (application-prod.properties) ---
# Aktivierung ausschliesslich ueber SPRING_PROFILES_ACTIVE=prod. Die Basis-application.properties
# gilt WEITERHIN; diese Datei UEBERSCHREIBT bzw. ERGAENZT nur die produktionsrelevanten Werte.
# Die lokale Entwicklung laeuft bewusst OHNE dieses Profil (dann greifen ausschliesslich die
# sicheren Defaults der Basiskonfiguration).
#
# WICHTIG: Diese Datei enthaelt KEINE Secrets - nur Umgebungsreferenzen (${...}) und sichere
# Defaults. Admin-, SMTP- und Tracking-Werte kommen ausschliesslich aus der Umgebung (siehe
# Basiskonfiguration). Zusaetzlich prueft ProductionConfigValidator die Produktionskonfiguration
# beim Start und verweigert den Start bei unsicherer/unvollstaendiger Konfiguration (fail-fast).

# --- Server / Betrieb hinter Reverse-Proxy bzw. Load-Balancer ---
# PORT: Container-/PaaS-Plattformen geben den zu bindenden Port oft per Umgebungsvariable vor.
server.port=${PORT:8080}
# X-Forwarded-*-Header auswerten, damit Schema/Host/Port des urspruenglichen Clients korrekt erkannt
# werden (korrekte https-Links, Redirects und das Secure-Session-Cookie hinter TLS-Terminierung).
# Spring Boot 4: Strategie "framework".
server.forward-headers-strategy=framework

# --- Persistenz: SQLite auf persistentem, konfigurierbarem Datenverzeichnis ---
# app.data.dir: dauerhaft gemountetes Verzeichnis (Default /data). Es haelt SOWOHL die DB-Datei ALS
# AUCH die erzeugten passiven Dateien, damit ein einziges gemountetes Volume (/data) genuegt. Es wird
# KEINE bestehende DB geloescht oder migriert - nur der Speicherort ist konfigurierbar.
app.data.dir=${APP_DATA_DIR:/data}
spring.datasource.url=jdbc:sqlite:${app.data.dir}/app.db?busy_timeout=5000&journal_mode=WAL
# Erzeugte passive Dateien ebenfalls unter dem persistenten Datenverzeichnis (ueberschreibbar).
app.files.generated-dir=${APP_FILES_GENERATED_DIR:${app.data.dir}/generated-files}

# --- Session-Cookie: in Produktion ist HTTPS Pflicht ---
# Zusaetzlich zu HttpOnly/SameSite=Lax (Basiskonfiguration) wird das Cookie in Produktion nur ueber
# HTTPS gesendet.
server.servlet.session.cookie.secure=true

# --- Logging: datensparsam, kein DEBUG/TRACE, kein SQL-Logging ---
logging.level.root=INFO
logging.level.de.internal.awareness=INFO
# Kein SQL-Logging (weder generiertes SQL noch Parameter-Bindings) - vermeidet Datenabfluss in Logs.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# --- Fehlerausgabe haerten (keine internen Details nach aussen geben) ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Versand bleibt bewusst deaktiviert ---
# app.mail.live-send-enabled wird hier NICHT gesetzt: der sichere Default (false) aus der
# Basiskonfiguration bleibt bestehen, damit nach einem Deploy kein versehentlicher Echtversand
# stattfindet. Echtversand muss bewusst per Umgebungsvariable APP_MAIL_LIVE_SEND_ENABLED aktiviert
# werden; dann verlangt ProductionConfigValidator zusaetzlich vollstaendige SMTP-Zugangsdaten.
