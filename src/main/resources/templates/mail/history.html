<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head th:replace="~{fragments/layout :: head('E-Mail-Verlauf')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <div th:replace="~{fragments/layout :: prodwarning}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <h1>E-Mail-Verlauf</h1>

    <p class="muted" th:if="${#lists.isEmpty(batches)}">Noch keine Versandvorgänge.</p>

    <table th:unless="${#lists.isEmpty(batches)}">
        <thead>
        <tr>
            <th>Zeitpunkt</th>
            <th>Betreff</th>
            <th>Anhang</th>
            <th>Empfänger</th>
            <th>erfolgreich</th>
            <th>fehlgeschlagen</th>
            <th>blockiert</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${batches}">
            <td th:text="${b.batch.createdAt}">Zeitpunkt</td>
            <td><a th:href="@{/mail/history/{id}(id=${b.batch.id})}" th:text="${b.batch.subject}">Betreff</a></td>
            <td th:text="${b.batch.attachmentFilename} ?: '—'">—</td>
            <td th:text="${b.batch.recipientCount}">0</td>
            <td th:text="${b.sent}">0</td>
            <td th:text="${b.failed}">0</td>
            <td th:text="${b.blocked}">0</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
