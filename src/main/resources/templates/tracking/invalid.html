<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<!--
  Neutrale Fehlerseite fuer unbekannte/ungueltige Tokens. Gibt bewusst KEINE Information darueber preis,
  ob ein Empfaenger oder Link existiert; keine IDs, keine Adresse, kein Token, kein Token-Hash.
-->
<head th:replace="~{fragments/layout :: head('Link nicht verfügbar')}"></head>
<body>
<main>
    <div class="card">
        <h1>Link nicht verfügbar</h1>
        <p>Dieser Link ist ungültig oder nicht mehr verfügbar.</p>
    </div>
</main>
</body>
</html>
