# --- Test-Overrides (NUR Abweichungen von src/main/resources/application.properties) ---
# Diese Datei liegt bewusst unter classpath:/config/: Spring Boot laedt sie ZUSAETZLICH zur
# Haupt-application.properties (mit hoeherer Prioritaet). Tests erben dadurch die reale
# Anwendungskonfiguration (Dialekt, ddl-auto=validate, PRAGMA foreign_keys via Hikari, Flyway)
# und ueberschreiben nur die Datasource-Isolation.
#
# Isolierte SQLite-Testdatenbank: eindeutige Datei pro Spring-Kontext (random.uuid) unter target/
# (wird von 'mvn clean' entfernt); beruehrt NIE die Dev-DB unter ./data/. Isolation je Testmethode
# zusaetzlich durch transaktionalen Rollback von @DataJpaTest. Das Schema erzeugen DIESELBEN
# Flyway-Migrationen wie in der Anwendung (classpath:db/migration) - keine separate Testschema-Datei.
spring.datasource.url=jdbc:sqlite:target/pat-test-${random.uuid}.db?busy_timeout=5000&journal_mode=WAL
spring.datasource.hikari.maximum-pool-size=1
