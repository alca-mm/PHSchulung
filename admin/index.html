<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Content-Security-Policy: verbietet externe Inhalte. Die connect-src-Direktive MUSS dieselbe
       Backend-Herkunft erlauben wie window.PH_API_BASE aus assets/config.js, sonst blockiert der
       Browser die fetch-Anfragen an das Backend. 'self' entspricht der Frontend-Herkunft der
       GitHub-Pages-Seite. Der GitHub-Pages-Workflow schreibt das gesamte "connect-src ... ;"-Segment
       beim Deployment auf die konfigurierte Backend-Herkunft um (bzw. auf "connect-src 'self';",
       wenn keine Herkunft gesetzt ist). Deshalb bleibt die CSP auf EINER Zeile und connect-src ein
       einzelnes, klar mit ';' abgeschlossenes Segment. Nur diese CSP-Zeile darf Herkuenfte auflisten. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://alca-mm.github.io http://localhost:8080; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Interne Admin-Auswertung des Security-Awareness-Trainings. Zugriff nur nach serverseitiger Anmeldung.">
  <title>Awareness Admin</title>
  <!-- WICHTIG: admin/index.html liegt unter /PHSchulung/admin/ - die Assets liegen eine Ebene hoeher unter
       /PHSchulung/assets/. Daher MUSS relativ mit "../assets/..." verwiesen werden (nicht "assets/...", das
       wuerde faelschlich /PHSchulung/admin/assets/... anfragen und mit 404 fehlschlagen -> leere Seite). -->
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <header class="admin-header" role="banner">
    <div class="brand">
      <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" role="img" aria-label="Schild-Symbol" focusable="false">
        <path fill="currentColor" d="M12 2 4 5v6c0 4.4 3.1 8.4 8 9.9 4.9-1.5 8-5.5 8-9.9V5l-8-3z" opacity="0.18"/>
        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M12 2.9 4.8 5.6v5.4c0 3.9 2.8 7.5 7.2 8.9 4.4-1.4 7.2-5 7.2-8.9V5.6L12 2.9z"/>
      </svg>
      <span class="brand-text">Awareness Admin</span>
    </div>
    <div class="header-right">
      <span id="conn-status" class="conn-status" aria-live="polite"></span>
      <span id="current-user" aria-live="polite"></span>
      <button id="refresh-btn" type="button" class="btn" hidden>Aktualisieren</button>
      <button id="logout-btn" type="button" class="btn" hidden>Abmelden</button>
    </div>
  </header>

  <main id="app" class="admin-main" role="main">
    <!-- Sofort sichtbarer Boot-Zustand: bleibt stehen, falls JS (noch) nicht laeuft, und wird von app.js beim
         ersten Rendern ersetzt. So erscheint NIEMALS eine leere/schwarze Seite. -->
    <div id="boot" class="loading">Awareness Admin wird geladen &hellip;</div>
    <noscript>Diese Oberfläche benötigt JavaScript. Bitte JavaScript aktivieren.</noscript>
  </main>

  <!-- Reihenfolge wichtig: config.js (Backend-Basis) -> api.js (Client) -> app.js (Steuerung). Relativ mit
       "../assets/", da diese Seite unter /PHSchulung/admin/ liegt. -->
  <script src="../assets/config.js"></script>
  <script src="../assets/api.js"></script>
  <script src="../assets/app.js"></script>
</body>
</html>
