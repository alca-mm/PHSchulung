name: Backend Image

# On every push to master: first run the full test suite, and only if it passes
# build the backend container image and push it to the GitHub Container Registry
# (GHCR). The `image` job depends on the `test` job (needs: test), so the image is
# never built or pushed when tests fail. Can also be triggered manually.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Minimal top-level default: read-only. The image job additionally requests
# packages:write below so only that job can push to GHCR.
permissions:
  contents: read

jobs:
  test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Build & Push Image (GHCR)
    runs-on: ubuntu-latest
    # Gate: only build/push the image after the test job succeeds.
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: meta
        shell: bash
        # GHCR requires a fully lowercase image path. Derive it from the repo
        # owner/name and lowercase both parts. Values come from trusted GitHub
        # context (repository_owner is the org/user, not user-controlled input).
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: phschulung
        run: |
          IMAGE="ghcr.io/${OWNER,,}/${REPO,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
